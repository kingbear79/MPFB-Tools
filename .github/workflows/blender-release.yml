name: Publish Blender extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-extension-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Blender 4.5.3
        run: |
          curl -fSL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Test legacy scene migration
        run: |
          "$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" -b -Y --factory-startup --python-exit-code 1 -P tests/legacy_scene_settings.py
      - name: Build package and index
        run: |
          python3 tools/build.py --blender "$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" --output "$RUNNER_TEMP/blender-feed"
      - name: Publish index and package
        run: |
          feed="$RUNNER_TEMP/blender-feed"
          checkout="$RUNNER_TEMP/blender-public"
          if git fetch origin refs/heads/blender-repository:refs/remotes/origin/blender-repository; then
            git worktree add --detach "$checkout" origin/blender-repository
            find "$checkout" -maxdepth 1 -name '*.zip' -type f -delete
          else
            git worktree add --detach "$checkout" HEAD
            git -C "$checkout" switch --orphan blender-repository
          fi
          cp "$feed"/index.json "$feed"/index.html "$feed"/*.zip "$checkout/"
          git -C "$checkout" config user.name 'github-actions[bot]'
          git -C "$checkout" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$checkout" add -A
          if ! git -C "$checkout" diff --cached --quiet; then
            git -C "$checkout" commit -m "Publish Blender extension $GITHUB_REF_NAME"
            git -C "$checkout" push origin HEAD:refs/heads/blender-repository
          fi
